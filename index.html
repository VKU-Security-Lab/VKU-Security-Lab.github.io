<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSL - VKU Security Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/asset/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="icon" href="/images/logo.jpg" type="image/x-icon">
    <script src="/page/elements/render.js" type="module"></script>
</head>

<body>
    <!-- Interactive Terminal Intro -->
    <div id="terminal-intro" class="terminal-intro">
        <div class="terminal-window" style="width: min(94%, 760px);">
            <div class="terminal-header">
                <span class="terminal-header-dot terminal-header-dot--red"></span>
                <span class="terminal-header-dot terminal-header-dot--yellow"></span>
                <span class="terminal-header-dot terminal-header-dot--green"></span>
                <span class="terminal-title">vsl@vku ~ interactive</span>
                <button id="terminal-close-btn" class="terminal-close-btn" title="Close terminal">&times;</button>
            </div>
            <div class="terminal-body" id="terminal-body" style="min-height: 340px; max-height: 70vh; cursor: text;">
                <div id="terminal-output"></div>
                <div class="terminal-input" id="terminal-input-line">
                    <span class="prompt">vsl@vku:~$</span>
                    <span id="terminal-typed"></span><span class="cursor"></span>
                </div>
            </div>
        </div>
    </div>

    <div id="main">
        <div id="header"></div>

        <section class="banner">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        <div id="banner-img"></div>
                        <h1 class="glitch mb-4" data-text="Welcome to VSL">Welcome to VSL</h1>
                        <p>A team of students passionate about cybersecurity, CTF competitions, and building the next generation of security researchers at VKU.</p>
                        <div>
                            <a href="/page/about_us/" class="btn btn-primary">About us</a>
                            <a href="/page/recruitment/" class="btn btn-secondary">Join us</a>
                        </div>
                    </div>
                </div>
                <div class="has-circle">
                    <span class="circle-1"></span>
                    <span class="circle-2"></span>
                    <span class="circle-3"></span>
                    <span class="circle-4"></span>
                    <span class="circle-5"></span>
                    <span class="circle-6"></span>
                    <span class="circle-7"></span>
                    <span class="circle-8"></span>
                    <span class="circle-9"></span>
                    <span class="circle-10"></span>
                </div>
            </div>
        </section>

        <div id="footer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="/asset/js/dark-mode.js" type="module"></script>
    <script src="/asset/js/terminal.js"></script>
</body>

</html>
