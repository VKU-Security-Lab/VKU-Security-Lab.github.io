<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSL - Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="stylesheet" href="/asset/css/style.css">
    <link rel="stylesheet" href="/asset/css/event.css">
    <link rel="icon" href="/images/logo.jpg" type="image/x-icon">
    <script src="/page/elements/render.js" type="module"></script>
    <script src="/asset/js/event.js" type="module"></script>
</head>

<body>
    <div id="main">
        <div id="header"></div>

        <div id="body">
            <div class="container my-5">
                <div class="page-header">
                    <h1>Events</h1>
                    <p>Competitions, workshops, and milestones of VKU Security Lab</p>
                </div>
                <hr>

                <div class="event-stats">
                    <div class="event-stat">
                        <span class="event-stat-value">120+</span>
                        <span class="event-stat-label">CTFs Competed</span>
                    </div>
                    <div class="event-stat">
                        <span class="event-stat-value">3</span>
                        <span class="event-stat-label">Events Organized</span>
                    </div>
                    <div class="event-stat">
                        <span class="event-stat-value">10+</span>
                        <span class="event-stat-label">Awards Won</span>
                    </div>
                    <div class="event-stat">
                        <span class="event-stat-value">3</span>
                        <span class="event-stat-label">Generations</span>
                    </div>
                </div>

                <div class="event-filters">
                    <button class="event-filter-btn active" data-filter="all">All</button>
                    <button class="event-filter-btn" data-filter="competition">Competitions</button>
                    <button class="event-filter-btn" data-filter="organized">Organized</button>
                    <button class="event-filter-btn" data-filter="internal">Internal</button>
                    <button class="event-filter-btn" data-filter="milestone">Milestones</button>
                </div>

                <div id="eventTimeline" class="event-timeline">
                </div>
            </div>
        </div>

        <div id="footer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="/asset/js/dark-mode.js" type="module"></script>
</body>

</html>
